services:
  backend:
    build:
      context: ./backend
    container_name: smart-commerce-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000
      LOG_LEVEL: info

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:5000/api
    container_name: smart-commerce-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
