services:
  mongo:
    image: mongo:7
    container_name: smart-commerce-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: smart-commerce-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/smart_ecommerce
      MongoDB_fallback: ""
      mongo_fallback: ""
      MONGO_FALLBACK: ""
      MONGODB_FALLBACK_URI: ""
      MONGODB_SECONDARY_URI: ""
      MONGODB_URI_SECONDARY: ""
      MONGODB_URI_2: ""
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_BACKEND_ORIGIN: ${NEXT_PUBLIC_BACKEND_ORIGIN:-http://localhost}
        NEXT_PUBLIC_BACKEND_PORT: ${NEXT_PUBLIC_BACKEND_PORT:-5000}
        NEXT_PUBLIC_API_PATH: ${NEXT_PUBLIC_API_PATH:-/api}
    container_name: smart-commerce-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:5000/api}
    depends_on:
      - backend

volumes:
  mongo-data:
